version: '3.9'

services:
  db:
    image: postgres:latest
    container_name: basable_db
    environment:
      POSTGRES_USER: ${BASABLE_DB_USER}
      POSTGRES_PASSWORD: ${BASABLE_DB_PASSWORD}
      POSTGRES_DB: ${BASABLE_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: basable_core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${BASABLE_DB_USER}:${BASABLE_DB_PASSWORD}@postgres:3306/${BASABLE_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      
    depends_on:
      - db

    ports:
      - "9000:9000"

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
