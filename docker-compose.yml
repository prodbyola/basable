version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: basable_db
    environment:
      POSTGRES_USER: ${BASABLE_DB_USER}
      POSTGRES_PASSWORD: ${BASABLE_DB_PASSWORD}
      POSTGRES_DB: ${BASABLE_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
